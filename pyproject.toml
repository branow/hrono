[project]
name = "hrono"
version = "0.1.0"
description = "Hierarchical, incrementally-updated knowledge base for AI agents"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Orest Bodnar", email = "branow.code@gmail.com" }]
keywords = [
    "knowledge-base",
    "ai-agents",
    "llm",
    "rag",
    "retrieval",
    "clustering",
    "summarization",
    "embeddings",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "anthropic>=0.40,<1",
    "cryptography>=44,<45",
    "fastapi>=0.115.0",
    "httpx>=0.27,<0.29",
    "jinja2>=3.1,<4",
    # Renders model-written Markdown. Model output is untrusted input, and
    # `html=False` escapes any HTML inside it; a hand-rolled renderer would
    # risk turning a summary into a script tag.
    "markdown-it-py>=3.0,<4",
    # Recall scores every in-scope passage per query as matrix-vector
    # products, 18x faster than interpreted loops. A core dependency, so
    # recall runs with no extra installed.
    "numpy>=1.26,<3",
    "platformdirs>=4.2,<5",
    "sqlite-vec>=0.1.9",
    "tomli-w>=1.0,<2.0",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-language-pack>=0.9,<0.13",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# In-process embedding (pulls torch). Opt-in so the default install stays lean.
embed = ["sentence-transformers>=3.0,<6"]
# In-process clustering (pulls numba, llvmlite, scipy, scikit-learn). Opt-in.
cluster = [
    "umap-learn>=0.5.6,<0.6",
    "hdbscan>=0.8.38,<0.9",
]

[project.urls]
Homepage = "https://github.com/branow/hrono"
Repository = "https://github.com/branow/hrono"
Issues = "https://github.com/branow/hrono/issues"
Changelog = "https://github.com/branow/hrono/blob/main/CHANGELOG.md"

[project.scripts]
hrono = "hrono.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.4.2",
    "ruff>=0.14.5",
    # The tests exercise the real UMAP -> HDBSCAN recipe, so the dev
    # environment carries the clustering extra.
    "umap-learn>=0.5.6,<0.6",
    "hdbscan>=0.8.38,<0.9",
    "numpy>=1.26,<3",
    "pytest-xdist>=3.8.0",
    "playwright==1.56.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
src = ["src", "tests"]
# research notebooks and evaluation scripts are records, not maintained code
extend-exclude = ["docs/research/prototype", "docs/evaluations/*/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true
# code quoted in a document stays as it was written
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# loadgroup keeps the "umap" groups of tests/conftest.py on one worker; without
# -n it changes nothing.
addopts = "--dist loadgroup"
markers = [
    "slow: drives a real browser or runs the real UMAP recipe (tests/conftest.py)",
]
