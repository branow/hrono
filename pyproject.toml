[project]
name = "hrono"
version = "0.1.0"
description = "Hierarchical, incrementally-updated knowledge base for AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40,<1",
    "cryptography>=44,<45",
    "fastapi>=0.115.0",
    "httpx>=0.27,<0.29",
    "jinja2>=3.1,<4",
    # Briefs and condensations are MARKDOWN — the models write headings, lists
    # and backticks — and the dashboard printed them as one unbroken line
    # (#200). CommonMark's reference implementation for Python, and the reason
    # it rather than a hand-rolled renderer: model output is untrusted input,
    # `html=False` escapes any HTML inside it, and getting that wrong by hand
    # is how a summary becomes a script tag.
    "markdown-it-py>=3.0,<4",
    # Recall's vector leg scores every in-scope passage per query, and that
    # arithmetic is the whole cost: 0.15 ms per passage in interpreted loops,
    # 18x faster as two matrix-vector products (#193, #194). The extras below
    # exist to keep torch and numba/llvmlite out of a lean install; numpy is
    # neither, and recall runs with no extra installed at all.
    "numpy>=1.26,<3",
    "platformdirs>=4.2,<5",
    "sqlite-vec>=0.1.9",
    "tomli-w>=1.0,<2.0",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-language-pack>=0.9,<0.13",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# In-process embedding backend (heavyweight: pulls torch). Opt-in so the default
# install stays lean; without it the `embed` op fails with a clean
# "in-process embedding backend is not installed" message. Enable with:
#   uv pip install "hrono[embed]"
embed = ["sentence-transformers>=3.0,<6"]
# In-process clustering backend (heavyweight: pulls numba/llvmlite/scipy/
# scikit-learn). Opt-in like `embed`; without it the `cluster` op fails with a
# clean "clustering backend is not installed" message. Enable with:
#   uv pip install "hrono[cluster]"
cluster = [
    "umap-learn>=0.5.6,<0.6",
    "hdbscan>=0.8.38,<0.9",
]

[project.scripts]
hrono = "hrono.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.4.2",
    "ruff>=0.14.5",
    # The clustering backend is an opt-in runtime extra, but the tests exercise
    # the real UMAP -> HDBSCAN recipe (known-group recovery), so the gate needs
    # it installed.
    "umap-learn>=0.5.6,<0.6",
    "hdbscan>=0.8.38,<0.9",
    "numpy>=1.26,<3",
    "pytest-xdist>=3.8.0",
    "playwright==1.56.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
src = ["src", "tests"]
# records kept as they were written: the research prototype, the 2026-09 QA
# harness and the first autodev loop are evidence, not code we maintain
extend-exclude = [
    "docs/design/prototype",
    "docs/evaluations/2026-09-manual-qa/scripts",
    "dev/autodev/archive",
    "dev/autodev/board/evidence",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true
# the code in a document is quoted as it was: a finding, a board ticket, a
# design note; the formatter must not rewrite the evidence it cites
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# loadgroup keeps the "umap" groups of tests/conftest.py on one worker; without
# -n it changes nothing.
addopts = "--dist loadgroup"
