[project]
name = "hrono"
version = "0.1.0"
description = "Hierarchical, incrementally-updated knowledge base for AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44,<45",
    "fastapi>=0.115.0",
    "sqlite-vec>=0.1.9",
    "tomli-w>=1.0,<2.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
hrono = "hrono.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.4.2",
    "ruff>=0.14.5",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
