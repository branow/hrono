[project]
name = "hrono"
version = "0.1.0"
description = "Hierarchical, incrementally-updated knowledge base for AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlite-vec>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.5",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
