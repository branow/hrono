# The gate CONTRIBUTING.md defines. CI reports rather than rewrites
# (`--check`, no `--fix`): a CI that fixes formatting hides whether the author
# ran the gate and pushes a commit nobody wrote.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A second push to the same branch makes the first run's answer stale.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Use the repository's Python
        run: uv python install

      # --locked fails when uv.lock has drifted from pyproject.toml. A
      # lockfile nobody verifies stops meaning anything.
      - name: Sync the locked environment
        run: uv sync --locked

      # The layout tests (tests/server/test_ui_browser.py) drive a real
      # Chromium. They skip locally without one and fail here, where a skip
      # would let the layout regressions they guard return unseen.
      - name: Install the browser
        run: uv run playwright install --with-deps chromium

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      # -rs prints the reason for every skip. The real-weights tests
      # (HRONO_TEST_REAL_MODEL) are meant to skip here; any other skip should
      # be visible, because a shrinking suite looks as green as a full one.
      - name: Test
        run: uv run pytest -q -rs -n auto

      - name: Test the Claude Code plugin
        run: node --test "plugins/hrono/scripts/tests/*.test.js"
