# The gate CONTRIBUTING.md defines, run where forgetting is not an option.
#
# `--check` rather than `--fix`: locally the formatter is authoritative and
# rewrites, here it reports. A CI that fixes formatting hides whether the
# author ran the gate and pushes a commit nobody wrote.
name: gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A second push to the same branch makes the first run's answer stale.
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Use the repository's Python
        run: uv python install

      # --locked fails when uv.lock has drifted from pyproject.toml. A
      # lockfile nobody verifies stops meaning anything.
      - name: Sync the locked environment
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      # -rs prints the reason for every skip. The two real-weights tests
      # (HRONO_TEST_REAL_MODEL) are meant to skip here; a suite that quietly
      # shrinks to forty tests looks exactly as green as one that does not.
      - name: Test
        run: uv run pytest -q -rs -n auto
