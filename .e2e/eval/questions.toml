# The question set for hrono's own repository (E004).
#
# Each question names the file that settles it (`sources`, repo-relative; any
# one of them counts) and the words a right answer contains (`expect`, any one
# of them, case-insensitive). `kind` is `shallow` (a top-level fact a brief
# should surface), `deep` (a constant or rule several hops down), or `none` (a
# control: the corpus does not contain the answer, and the right answer is
# NOT FOUND with no source).
#
# Settled against main at f3e4853, scoped to what the eval tree ingests:
# src/**, README.md, CONTRIBUTING.md, GLOSSARY.md, pyproject.toml.

[[question]]
id = "q01"
kind = "shallow"
question = "What hop limit does `hrono tree export` use when --levels is not given?"
expect = ["4"]
sources = ["src/hrono/tree/commands.py"]

[[question]]
id = "q02"
kind = "shallow"
question = "Which environment variable sets how many LLM calls one op runs at once, and what is the default?"
expect = ["HRONO_LLM_CONCURRENCY"]
sources = ["src/hrono/summarize/pool.py", "README.md"]

[[question]]
id = "q03"
kind = "shallow"
question = "How does hrono store a user's API token in the database?"
expect = ["sha-256", "sha256"]
sources = ["src/hrono/crypto/tokens.py", "src/hrono/auth/users.py"]

