{% extends "base.html" %}
{% block title %}hrono — sign in{% endblock %}
{% block chrome %}{% endblock %}
{% block main %}
<h1>hrono</h1>
<p>Sign in with the same API token the CLI uses.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/ui/login">
  <input type="password" name="token" aria-label="api token" autofocus
         autocomplete="off" placeholder="api token" size="48">
  <button type="submit">sign in</button>
</form>
{% endblock %}
